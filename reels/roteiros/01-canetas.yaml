legenda: |
  O que acontece quando você para a semaglutida? A segunda parte do estudo STEP 1 que quase ninguém conta.

  Com a patente vencida em março de 2026, a caneta ficou mais barata no Brasil. No STEP 1, quem usou semaglutida 2,4 mg perdeu 14,9% do peso em 68 semanas, contra 2,4% no placebo.

  Depois, tudo foi suspenso. Um ano mais tarde, os 327 participantes acompanhados tinham recuperado dois terços do peso perdido, e a maior parte das melhoras metabólicas também voltou.

  Não é motivo para ter medo do remédio. É motivo para começar sabendo que obesidade é doença crônica.

  ⚠️ Não comece nem pare nenhum medicamento sem conversar com o seu médico.

  Fontes: Wilding JPH et al. N Engl J Med. 2021. doi:10.1056/NEJMoa2032183 · Wilding JPH et al. Diabetes Obes Metab. 2022. doi:10.1111/dom.14725

  📤 Manda pra quem vai começar a caneta.

