legenda: |
  Teste de sentar e levantar do chão: qual é a sua nota? O estudo brasileiro de 2026 que ligou a nota a 12 anos de acompanhamento.

  Você começa com 10 pontos. Perde 1 a cada apoio de mão ou joelho e meio ponto se desequilibrar.

  No estudo da clínica CLINIMEX, no Rio, com 4.282 adultos de 46 a 75 anos, morreram 3,7% de quem tirou 10 e 42,1% de quem tirou de 0 a 4. É associação: o estudo não testou se treinar para melhorar a nota reduz o risco.

  ⚠️ Dor no joelho, no quadril ou histórico de queda? Faça o teste com o seu médico ou fisioterapeuta.

  O carrossel completo, com o estudo, está no perfil.

  Fonte: Araújo CGS et al. Sitting-rising test scores predict natural and cardiovascular causes of deaths. Eur J Prev Cardiol. 2026. doi:10.1093/eurjpc/zwaf325

  💬 Comente a sua nota.

