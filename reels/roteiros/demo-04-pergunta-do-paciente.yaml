    resposta: |
      **P11 · Para leigos** — teste de sentar e levantar do chão
      ## A ideia central
      Quem teve mais dificuldade no teste de sentar e levantar do chão morreu mais nos anos seguintes.
      ## Como o estudo foi feito
      Pesquisadores do Rio de Janeiro aplicaram o teste em 4.282 adultos de 46 a 75 anos, deram uma nota de 0 a 10 e acompanharam essas pessoas por cerca de 12 anos.
      ## O que encontraram
      De cada 100 pessoas com nota 10, 3,7 morreram no período. De cada 100 com nota de 0 a 4, 42,1 morreram.
      ## O que isso não quer dizer
      - Não mostra que o teste, ou treinar para ele, muda quanto tempo alguém vive: o estudo observou, não testou.
      - Não é uma previsão para uma pessoa só.
      ## Texto pronto
      "Esse estudo acompanhou 4.282 pessoas por cerca de 12 anos. Quem teve mais dificuldade no teste morreu mais no período. É uma associação, não uma previsão para o senhor. O que fazer no seu caso depende de uma avaliação individual."

