titulo: 5 regras de IA para médicos
arquetipo: Erro / alerta
objetivo: envios
publicar: Semana 4 · segunda

slides:
  - tipo: capa
    tag: Alerta
    titulo: 5 coisas que você nunca deve fazer com IA ==se você é médico==
    subtitulo: LGPD, periódicos e ética. O básico para pesquisar com IA sem colocar você e o paciente em risco.

  - tipo: texto
    tag: Regra 1
    titulo: Nunca cole dados que ==identifiquem o paciente==
    texto: |
      Dado de saúde é **dado pessoal sensível** pela LGPD (Lei 13.709/2018).

      Tirar o nome não basta. Iniciais, data de nascimento, prontuário, datas de internação, cidade pequena e doença rara também identificam.
    nota: Em pesquisa com dados de pacientes, siga também o protocolo aprovado pelo CEP.

  - tipo: texto
    tag: Regra 2
    titulo: Nunca cite uma referência ==que você não abriu==
    texto: |
      A IA pode inventar autor, revista, DOI e PMID.

      Toda citação precisa ser conferida na fonte: PubMed, site da revista, DOI.

  - tipo: texto
    tag: Regra 3
    titulo: Nunca esconda o ==uso de IA== no manuscrito
    texto: |
      O ICMJE pede que os autores declarem o uso de IA e diz que chatbots **não podem ser autores**: a responsabilidade pelo conteúdo é de quem assina.

      Confira também a política da revista.

  - tipo: texto
    tag: Regra 4
    titulo: Nunca envie à IA o manuscrito ==que você está revisando==
    texto: |
      Pelo ICMJE, o revisor não deve colocar o manuscrito em ferramentas de IA que não garantam confidencialidade.

      O mesmo cuidado vale para dados não publicados do seu grupo.

  - tipo: texto
    tag: Regra 5
    titulo: Nunca terceirize o ==julgamento clínico==
    texto: |
      A IA organiza, resume e sugere.

      Decidir se uma evidência muda a conduta é trabalho de quem responde pelo paciente: **você**.

  - tipo: lista
    tag: Resumo
    titulo: Antes de colar qualquer coisa na IA
    estilo: check
    itens:
      - Tem algum dado que identifica alguém?
      - É confidencial ou ainda não publicado?
      - Vou conferir o que ela devolver?
      - Vou declarar o uso, se for publicar?

  - tipo: cta
    destaque: enviar
    titulo: Manda para o seu grupo de pesquisa ==antes do próximo artigo==.
    texto: E salve para consultar sempre que bater a dúvida.
    extra: Todos os prompts da biblioteca paper.ai__ seguem essas 5 regras. **Lista de espera no link da bio.**

legenda: |
  IA na pesquisa médica com ética: 5 coisas que você nunca deve fazer com IA se você é médico.

  1. Nunca cole dados que identifiquem o paciente. Dado de saúde é dado pessoal sensível pela LGPD (Lei 13.709/2018), e tirar o nome não basta.
  2. Nunca cite uma referência que você não abriu. A IA pode inventar autor, revista, DOI e PMID.
  3. Nunca esconda o uso de IA no manuscrito. O ICMJE pede a declaração e não aceita chatbot como autor.
  4. Nunca envie à IA o manuscrito que você está revisando. O ICMJE orienta revisores a não colocar manuscritos em ferramentas que não garantam confidencialidade.
  5. Nunca terceirize o julgamento clínico. A IA sugere; a decisão é sua.

  Em pesquisa com dados de pacientes, siga também o protocolo aprovado pelo CEP e a política da revista.

  📤 Manda para o seu grupo de pesquisa.

hashtags: [iaparamedicos, eticamedica, lgpd, pesquisamedica, paperai]
