titulo: Manifesto da paper.ai__
arquetipo: Bastidor / venda
objetivo: seguidores (fixar no perfil)
publicar: Semana 1 · segunda

slides:
  - tipo: capa
    tag: Manifesto
    titulo: Você não precisa ler ==mais artigos==. Precisa fazer *perguntas melhores*.
    subtitulo: Por que a paper.ai__ existe e o que você vai encontrar aqui.
    comando: Atue como pesquisador sênior em [SUA ÁREA]...

  - tipo: numero
    tag: O tamanho do problema
    numero: +1 mi
    titulo: de artigos novos entram no PubMed ==todo ano==
    texto: |
      Ninguém lê tudo. Nem precisa.

      O que separa quem se atualiza de quem se afoga é saber **o que perguntar**.
    fonte: National Library of Medicine, estatísticas do PubMed/MEDLINE.

  - tipo: texto
    tag: A promessa
    titulo: A IA lê um artigo em ==segundos==
    texto: |
      ChatGPT, Claude, Gemini, NotebookLM: todas resumem, traduzem e explicam.

      O problema não é a ferramenta. É **o que você pede** para ela.

  - tipo: contraste
    tag: A diferença
    titulo: Pedido genérico, resposta genérica
    ruim:
      rotulo: O que quase todo mundo pede
      texto: Resume esse artigo pra mim.
    bom:
      rotulo: O que um pesquisador pede
      texto: |
        Extraia PICO, desenho, n, desfecho primário com IC 95% e limitações.
        Cite a seção de cada dado.
        Se não constar, escreva "não consta".

  - tipo: numero
    tag: O risco
    numero: 47%
    titulo: das referências geradas pelo ChatGPT-3.5 num estudo ==não existiam==
    texto: Só 7% estavam corretas. Modelos novos erram menos. Mas erram.
    fonte: Bhattacharyya M et al. Cureus. 2023;15(5):e39238.

  - tipo: lista
    tag: O que você vai encontrar aqui
    titulo: Método, não mágica
    estilo: check
    itens:
      - t: Prompts prontos
        d: Para cada etapa da pesquisa, da pergunta ao abstract.
      - t: Leitura crítica
        d: RoB 2, GRADE e vieses explicados sem enrolação.
      - t: Estatística sem medo
        d: NNT, RR, HR e IC 95% como um preceptor explicaria.
      - t: Estudo ativo
        d: Flashcards e revisão espaçada a partir de artigos e diretrizes.
      - t: IA com ética
        d: LGPD, declaração de uso e checagem de tudo.

  - tipo: texto
    tag: Quem faz
    titulo: Feito por médico. Com IA. ==Revisado por humano.==
    texto: |
      Cada prompt daqui nasce de um framework científico (PICO, PRISMA, CONSORT, RoB 2, GRADE) e é testado em artigos reais antes de chegar até você.

  - tipo: cta
    destaque: seguir
    titulo: Siga para pesquisar ==melhor==, não mais.
    texto: Toda semana, prompts prontos para copiar, testados e explicados.
    extra: Estamos construindo a **biblioteca paper.ai__**, com um prompt para cada etapa da pesquisa. Lista de espera no link da bio.

legenda: |
  Prompts de IA para pesquisa médica: por que a paper.ai__ existe.

  Mais de 1 milhão de artigos novos entram no PubMed todo ano. A IA consegue ler, resumir e explicar em segundos, mas só responde bem a quem pergunta bem.

  Aqui você vai encontrar:
  ✅ Prompts prontos para cada etapa da pesquisa
  ✅ Leitura crítica sem enrolação
  ✅ Estatística explicada como um preceptor faria
  ✅ Estudo ativo com IA
  ✅ Uso ético: LGPD, declaração de uso e checagem

  Feito por médico, com ajuda de IA, revisado por humano.

  👉 Siga @paper.ai__ e ative as notificações. A biblioteca completa está chegando; a lista de espera está no link da bio.

  Referência citada: Bhattacharyya M et al. High Rates of Fabricated and Inaccurate References in ChatGPT-Generated Medical Content. Cureus. 2023. doi:10.7759/cureus.39238

hashtags: [pesquisamedica, medicinabaseadaemevidencias, iaparamedicos, promptsdeia, paperai]
