titulo: O artigo em 10 minutos
arquetipo: Prompt pronto
objetivo: salvamentos
publicar: Semana 2 · sexta

slides:
  - tipo: capa
    tag: Prompt pronto
    titulo: Leia um artigo de 20 páginas em ==10 minutos==
    subtitulo: Sem pular o que importa. A ficha de leitura que todo preceptor gostaria que você fizesse.
    comando: Anexei o PDF de [ARTIGO]...

  - tipo: texto
    tag: O problema
    titulo: O resumo da IA ==esconde== o que você precisava ver
    texto: |
      "Resuma esse artigo" devolve a conclusão dos autores. Sem números, sem limitações, sem o tamanho do efeito.

      Para decidir se o estudo muda sua prática, você precisa de uma **ficha de leitura**, não de um resumo.

  - tipo: lista
    tag: O que a ficha extrai
    titulo: 6 itens que não podem faltar
    itens:
      - t: Pergunta e desenho
        d: O PICO do estudo e o tipo de estudo.
      - t: População
        d: n, critérios, cenário e tempo de seguimento.
      - t: Resultado principal
        d: A medida de efeito com IC 95%, no desfecho primário.
      - t: Segurança
        d: Eventos adversos relevantes.
      - t: Limitações
        d: As declaradas pelos autores e as que eles não citaram.
      - t: Financiamento
        d: Quem pagou o estudo e os conflitos de interesse.

  - tipo: prompt
    tag: Copie e cole
    titulo: O prompt
    parte: 1/2
    prompt: |
      Atue como epidemiologista clínico preparando uma ficha de leitura.
      Anexei o artigo [TÍTULO OU PDF]. Meu objetivo: [OBJETIVO].

      Preencha a ficha em tabela:
      1. Pergunta (PICO) e desenho do estudo
      2. População: n, critérios, cenário e seguimento
      3. Desfecho primário: resultado com medida de efeito e IC 95%
      4. Desfechos secundários (marque como exploratórios)
      5. Eventos adversos relevantes

  - tipo: prompt
    tag: Copie e cole
    titulo: O prompt, continuação
    parte: 2/2
    prompt: |
      6. Limitações citadas pelos autores
      7. Limitações que os autores NÃO citaram
      8. Financiamento e conflitos de interesse
      9. Em 3 linhas: isso se aplica a [MEU CENÁRIO]?

      Regras: cite a seção ou a página de cada dado. Se não constar, escreva "não consta". Não arredonde números.
    rodape: O prompt completo está na legenda, pronto para copiar.

  - tipo: texto
    tag: O item mais valioso
    titulo: O item 7 ==separa o leitor do pesquisador==
    texto: |
      Todo artigo lista limitações. Quase nenhum lista todas.

      Pedir as limitações **não declaradas** (perda de seguimento, desfecho substituto, população muito selecionada) treina o seu olhar crítico.

  - tipo: lista
    tag: Depois da ficha
    titulo: Mais 2 minutos seus
    estilo: check
    itens:
      - t: Confira os números na tabela do artigo
        d: Principalmente o desfecho primário e o IC.
      - t: Leia os métodos
        d: É onde moram os vieses.
      - t: Decida você
        d: A IA organiza. O julgamento é seu.

  - tipo: cta
    destaque: salvar
    titulo: Salve para o próximo artigo que você precisar ler ==para ontem==.
    texto: No próximo post, os números do artigo. NNT, RR e HR explicados como um preceptor.
    extra: A biblioteca paper.ai__ está chegando. **Lista de espera no link da bio.**

legenda: |
  Como ler um artigo científico com IA em 10 minutos: a ficha de leitura que não pula o que importa.

  "Resuma esse artigo" devolve a conclusão dos autores, sem números e sem limitações. Para decidir se um estudo muda sua prática, você precisa de uma ficha de leitura.

  📋 PROMPT PARA COPIAR:

  Atue como epidemiologista clínico preparando uma ficha de leitura.
  Anexei o artigo [TÍTULO OU PDF]. Meu objetivo: [OBJETIVO].

  Preencha a ficha em tabela:
  1. Pergunta (PICO) e desenho do estudo
  2. População: n, critérios, cenário e seguimento
  3. Desfecho primário: resultado com medida de efeito e IC 95%
  4. Desfechos secundários (marque como exploratórios)
  5. Eventos adversos relevantes
  6. Limitações citadas pelos autores
  7. Limitações que os autores NÃO citaram
  8. Financiamento e conflitos de interesse
  9. Em 3 linhas: isso se aplica a [MEU CENÁRIO]?

  Regras: cite a seção ou a página de cada dado. Se não constar, escreva "não consta". Não arredonde números.

  ⚠️ Depois, confira os números na tabela do artigo. A IA organiza; o julgamento é seu.

  💾 Salve para o próximo artigo e siga @paper.ai__.

hashtags: [leituracritica, pesquisamedica, journalclub, promptsdeia, paperai]
