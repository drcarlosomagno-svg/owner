titulo: O método P.A.P.E.R.
arquetipo: O que é…?
objetivo: salvamentos
publicar: Semana 1 · quarta

slides:
  - tipo: capa
    tag: Método
    titulo: Você está usando o ChatGPT ==errado== para ler artigos
    subtitulo: "O método P.A.P.E.R.: 5 blocos que transformam qualquer pedido em prompt de pesquisador."

  - tipo: texto
    tag: O problema
    titulo: A IA não é ruim. O seu pedido é que está ==incompleto==.
    texto: |
      Sem papel, sem material, sem formato e sem regras, a IA preenche as lacunas com o que é **mais provável**.

      Não com o que é verdade.

  - tipo: lista
    tag: O método
    titulo: P.A.P.E.R., bloco por bloco
    itens:
      - m: P
        t: Papel
        d: Quem a IA deve ser. *Atue como revisor de periódico de cardiologia.*
      - m: A
        t: Artigo e contexto
        d: O material e o objetivo. *Anexei o PDF; vou apresentar no journal club.*
      - m: P
        t: Pedido
        d: A tarefa em passos numerados, um verbo por passo.
      - m: E
        t: Estrutura
        d: O formato da resposta. *Tabela, tópicos, até 200 palavras.*
      - m: R
        t: Regras
        d: A checagem. *Cite a seção; se não constar, diga "não consta".*

  - tipo: texto
    tag: O bloco mais esquecido
    titulo: R de Regras, o que ==impede a IA de inventar==
    texto: |
      Sem regras, a IA completa lacunas com o que parece plausível.

      Com regras, ela passa a responder **"não consta no texto"**. Na pesquisa, isso vale ouro.

  - tipo: contraste
    tag: Antes e depois
    titulo: O mesmo pedido, com e sem método
    ruim:
      rotulo: Sem método
      texto: Me explica esse artigo.
    bom:
      rotulo: Com P.A.P.E.R.
      texto: |
        P: Atue como epidemiologista clínico.
        A: Anexei um ECR; vou decidir se muda minha prática.
        P: Resuma a pergunta, o desenho e o resultado principal.
        E: Tabela com 3 linhas, sem jargão.
        R: Cite a seção de cada dado. Se não constar, escreva "não consta".

  - tipo: prompt
    tag: Copie e cole
    titulo: O modelo P.A.P.E.R.
    prompt: |
      PAPEL: Atue como [ESPECIALISTA] com experiência em [ÁREA].

      ARTIGO E CONTEXTO: Vou te enviar [MATERIAL]. Meu objetivo é [OBJETIVO].

      PEDIDO:
      1. [TAREFA 1]
      2. [TAREFA 2]
      3. [TAREFA 3]

      ESTRUTURA: Responda em [FORMATO], com no máximo [TAMANHO].

      REGRAS: Use apenas o material enviado. Cite a seção ou página de cada afirmação. Se algo não estiver no texto, escreva "não consta". Não invente referências.
    rodape: Ajuste Papel, Estrutura e Regras uma vez. Depois, troque só o Material e o Pedido.

  - tipo: cta
    destaque: salvar
    titulo: Salve o modelo P.A.P.E.R. para o ==próximo artigo==.
    texto: Nos próximos posts, você vai ver o método aplicado em cada etapa da pesquisa, começando pelo PICO.
    extra: A biblioteca paper.ai__ está chegando. **Lista de espera no link da bio.**

legenda: |
  Como usar o ChatGPT para ler artigos científicos: o método P.A.P.E.R. em 5 blocos.

  A IA não é ruim; o pedido é que costuma estar incompleto. Sem contexto e sem regras, ela completa as lacunas com o que é mais provável, e nem sempre com o que é verdade.

  P: Papel (quem a IA deve ser)
  A: Artigo e contexto (o material e o seu objetivo)
  P: Pedido (a tarefa em passos)
  E: Estrutura (o formato da resposta)
  R: Regras (a checagem que impede a invenção)

  📋 MODELO PARA COPIAR:

  PAPEL: Atue como [ESPECIALISTA] com experiência em [ÁREA].
  ARTIGO E CONTEXTO: Vou te enviar [MATERIAL]. Meu objetivo é [OBJETIVO].
  PEDIDO:
  1. [TAREFA 1]
  2. [TAREFA 2]
  3. [TAREFA 3]
  ESTRUTURA: Responda em [FORMATO], com no máximo [TAMANHO].
  REGRAS: Use apenas o material enviado. Cite a seção ou página de cada afirmação. Se algo não estiver no texto, escreva "não consta". Não invente referências.

  💾 Salve para o próximo artigo e siga @paper.ai__.

hashtags: [promptsdeia, pesquisamedica, chatgptparamedicos, medicinabaseadaemevidencias, paperai]
