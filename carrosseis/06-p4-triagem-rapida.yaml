titulo: P4 · Triagem Rápida (e o P5)
arquetipo: Prompt da biblioteca
objetivo: salvamentos
publicar: Semana 2 · sexta
produto: P4

slides:
  - tipo: capa
    tag: Ler
    titulo: Em segundos, saiba se o artigo ==merece a sua leitura==
    subtitulo: O P4 faz a triagem. O P5 disseca o que passou.

  - tipo: texto
    tag: O problema
    titulo: Quanto tempo você já gastou num artigo ==que não respondia à sua pergunta?==
    texto: |
      Artigo do grupo, do alerta, do colega. Antes de ler, decida se vale a pena.

      O P4 julga o **desenho real, não o prometido**, e trata ausência de dado como informação, como faz um revisor experiente.

  - tipo: lista
    tag: O semáforo do P4
    titulo: Um veredito por artigo
    itens:
      - m: 🟢
        t: Ler inteiro
        d: Vai para a leitura completa.
      - m: 🟡
        t: Ler só os métodos
        d: Pode servir, mas confira como foi feito antes de confiar.
      - m: 🔴
        t: Descartar
        d: Não vale o seu tempo para essa pergunta.
    nota: Serve para um artigo ou para uma pilha de dez. No fim, vem a ordem de leitura.

  - tipo: resposta
    tag: O que volta
    titulo: O formato da resposta
    rotulo: Resposta do P4
    cortada: true
    resposta: |
      # P4 · Triagem — 3 artigos
      Legenda: 🟢 ler inteiro · 🟡 ler só os métodos · 🔴 descartar
      ## Em 30 segundos
      **Ordem de leitura:** [2] → [1] · **Descartar:** [3]
      ## 🟢 [2] [título curto] — [Autor], [ano]
      - **Desenho e n:** [...]
      - **Desfecho:** [clínico ou substituto · primário ou secundário]
      - **Efeito:** [medida (IC 95% ...)] ou “não informado no resumo”
      - **Ameaça principal:** [...]
      - **Veredito:** [uma frase]

  - tipo: texto
    tag: Passou na triagem?
    codigo: P5
    titulo: No P5, você não lê o artigo. ==Você o interroga.==
    texto: |
      Veredito, ficha do estudo, registro × publicação, risco de viés por domínio, números absolutos, *spin* e certeza da evidência (GRADE).

  - tipo: lista
    tag: Dissecação de um artigo
    codigo: P5
    titulo: 3 movimentos que quase nenhum leitor faz sozinho
    itens:
      - t: Reconstruir o estudo sem o resumo
        d: O resumo é a vitrine. Os métodos são o estudo.
      - t: Abrir o registro do ensaio
        d: Para caçar troca de desfecho entre o protocolo e a publicação.
      - t: Pôr resultado, conclusão e título lado a lado
        d: É assim que o *spin* aparece.

  - tipo: cta
    destaque: salvar
    titulo: Salve para a próxima ==pilha de artigos==.
    texto: No próximo post, os números do artigo em risco absoluto, com o P10.
    extra: A **Biblioteca de Prompts paper.ai__** está chegando. Lista de espera no link da bio.

legenda: |
  Como fazer triagem de artigos científicos com IA: em segundos, saiba se o artigo merece a sua leitura.

  O P4 da Biblioteca paper.ai__ julga o desenho real (não o prometido) de cada artigo e dá um semáforo:
  🟢 ler inteiro
  🟡 ler só os métodos
  🔴 descartar
  No fim, vem a ordem de leitura e a ameaça principal de cada estudo.

  O que passou vai para o P5, a Dissecação de um Artigo: veredito, ficha do estudo, registro × publicação, risco de viés por domínio, números absolutos, spin e GRADE. No P5, você não lê o artigo: você o interroga.

  ⚠️ A triagem organiza. A decisão de ler, e de mudar a conduta, é sua.

  💾 Salve para a próxima pilha de artigos e siga @paper.ai__.

hashtags: [leituracritica, pesquisamedica, journalclub, promptsdeia, paperai]
