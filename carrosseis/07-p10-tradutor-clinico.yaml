arquetipo: O que é…?
objetivo: salvamentos
publicar: Semana 3 · segunda
produto: P10

slides:
  - tipo: capa
    tag: Usar
    titulo: Risco relativo impressiona. ==Risco absoluto informa.==
    subtitulo: NNT, RR e HR sem medo, e o prompt que leva os números do estudo para a consulta.

  - tipo: numero
    tag: A pegadinha
    numero: 25%
    titulo: de redução do risco pode ser ==só 2,5 pontos percentuais==
    texto: |
      Se o evento cai de **10%** para **7,5%**, o risco relativo cai 25%. O risco absoluto cai 2,5 pontos.

      As duas frases descrevem o mesmo resultado.
    nota: Exemplo hipotético, para fins didáticos.

  - tipo: lista
    tag: As siglas
    titulo: O que cada número diz
    itens:
      - m: RR
        t: Risco relativo
        d: Risco no tratado ÷ risco no controle. 7,5% ÷ 10% = 0,75.
      - m: RRA
        t: Redução absoluta do risco
        d: Risco no controle − risco no tratado. 10% − 7,5% = 2,5 pontos.
      - m: NNT
        t: Número necessário para tratar
        d: 1 ÷ RRA. 1 ÷ 0,025 = 40 tratados para evitar 1 evento, no tempo do estudo.

  - tipo: lista
    tag: As siglas
    titulo: E as três que mais confundem
    itens:
      - m: OR
        t: Razão de chances (odds ratio)
        d: Parecida com o RR quando o evento é raro. Se afasta dele quando o evento é comum.
      - m: HR
        t: Hazard ratio
        d: Compara o risco instantâneo de evento ao longo do tempo, em análises de sobrevida.
      - m: IC
        t: Intervalo de confiança de 95%
        d: Para RR, OR e HR, se o intervalo inclui 1, o resultado não é estatisticamente significativo a 5%.

  - tipo: resposta
    tag: O que volta
    titulo: O formato da resposta
    rotulo: Resposta do P10
    cortada: true
    resposta: |
      # P10 · Tradutor clínico — [Autor], [ano]
      ## Em 30 segundos
      [o efeito em número absoluto: “de cada 100 pessoas...”]
      ## Os números que importam
      Desfecho · Controle · Intervenção · Diferença absoluta · NNT/NNH
      Conta: [como cada número foi calculado] [cálculo meu]
      ## Danos
      - [o que foi medido, com números]
      - [o que não foi medido]
      ## Na consulta
      - “[frase 1]”

  - tipo: texto
    tag: Cuidado
    titulo: Confira a conta. ==Sempre.==
    texto: |
      IA pode errar aritmética. Por isso o P10 marca toda conta com **[cálculo meu]** e mostra o cálculo ao lado: você confere em segundos.

      E lembre: o NNT vale para o **tempo de seguimento** do estudo.

  - tipo: cta
    destaque: salvar
    titulo: Salve para o próximo ==journal club==.
    texto: “Saiu um estudo grande e a conduta mudou.” Mudou mesmo? É o próximo post.
    extra: A **Biblioteca de Prompts paper.ai__** está chegando. Lista de espera no link da bio.

legenda: |
  NNT, risco relativo, odds ratio e hazard ratio: como levar os números de um estudo para a consulta.

  “Reduziu o risco em 25%” pode significar uma queda de 10% para 7,5%, ou seja, 2,5 pontos percentuais e NNT de 40. As duas frases descrevem o mesmo resultado (exemplo hipotético).

  RR = risco no tratado ÷ risco no controle
  RRA = risco no controle − risco no tratado
  NNT = 1 ÷ RRA (vale para o tempo de seguimento do estudo)
  OR ≈ RR só quando o evento é raro
  HR = risco instantâneo ao longo do tempo (análise de sobrevida)
  IC 95% que inclui 1 = não significativo a 5% (para RR, OR e HR)

  O P10 da Biblioteca paper.ai__, o Tradutor Clínico, converte o resultado em risco absoluto, NNT e danos, mostra a conta e escreve três frases para a consulta.

  ⚠️ IA pode errar conta. Confira sempre.

  💾 Salve para o próximo journal club.

