titulo: Prompt comum × prompt de pesquisador
arquetipo: Contraste
objetivo: envios
publicar: Semana 4 · quarta

slides:
  - tipo: capa
    tag: Contraste
    titulo: Prompt comum × ==prompt de pesquisador==
    subtitulo: 3 pedidos que todo mundo faz para a IA e como transformar cada um em uma resposta que dá para usar.

  - tipo: texto
    tag: A diferença
    titulo: A IA é tão boa quanto a ==pergunta que recebe==
    texto: |
      Mesma IA, mesmo artigo. O que muda o resultado é o pedido.

      Papel, material, tarefa, formato e regras: o método **P.A.P.E.R.**

  - tipo: contraste
    tag: 1 · Resumo
    titulo: Resumir um artigo
    ruim:
      texto: Resume esse artigo.
    bom:
      texto: |
        Resuma este ECR em tabela: PICO, n, desfecho primário com IC 95%, eventos adversos e 3 limitações.
        Cite a seção de cada dado.

  - tipo: contraste
    tag: 2 · Estatística
    titulo: Entender um resultado
    ruim:
      texto: O que significa HR 0,80?
    bom:
      texto: |
        Explique o HR 0,80 (IC 95% 0,70 a 0,91) deste estudo para um residente: o que mede, se é significativo e o que NÃO dá para concluir.
        Use os dados da tabela que colei.

  - tipo: contraste
    tag: 3 · Estudo
    titulo: Estudar uma diretriz
    ruim:
      texto: Me ensina a diretriz de hipertensão.
    bom:
      texto: |
        Com base só no trecho da diretriz que colei, crie 15 flashcards de pergunta e resposta, um fato por card, com a seção de origem.

  - tipo: lista
    tag: O padrão
    titulo: O que os prompts bons têm em comum
    estilo: check
    itens:
      - Um **papel** claro para a IA
      - O **material** colado ou anexado
      - Uma **tarefa** com passos
      - Um **formato** de saída definido
      - Uma **regra** de checagem

  - tipo: cta
    destaque: enviar
    titulo: Manda para quem ainda pede ==“resume esse artigo”==.
    texto: E salve para reescrever os seus próximos pedidos.
    extra: A biblioteca paper.ai__ traz prompts de pesquisador para cada etapa. **Lista de espera no link da bio.**

legenda: |
  Prompt para pesquisa médica: a diferença entre o prompt comum e o prompt de pesquisador.

  Mesma IA, mesmo artigo. O que muda o resultado é o pedido.

  1️⃣ Resumo
  ❌ "Resume esse artigo."
  ✅ "Resuma este ECR em tabela: PICO, n, desfecho primário com IC 95%, eventos adversos e 3 limitações. Cite a seção de cada dado."

  2️⃣ Estatística
  ❌ "O que significa HR 0,80?"
  ✅ "Explique o HR 0,80 (IC 95% 0,70 a 0,91) deste estudo para um residente: o que mede, se é significativo e o que NÃO dá para concluir. Use os dados da tabela que colei."

  3️⃣ Estudo
  ❌ "Me ensina a diretriz de hipertensão."
  ✅ "Com base só no trecho da diretriz que colei, crie 15 flashcards de pergunta e resposta, um fato por card, com a seção de origem."

  📤 Manda para quem ainda pede "resume esse artigo".

hashtags: [promptsdeia, chatgptparamedicos, pesquisamedica, residenciamedica, paperai]
