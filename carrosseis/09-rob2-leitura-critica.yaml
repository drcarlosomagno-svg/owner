titulo: RoB 2 com IA
arquetipo: O que é…?
objetivo: salvamentos
publicar: Semana 3 · sexta

slides:
  - tipo: capa
    tag: Leitura crítica
    titulo: O checklist que revisores usam e ==quase ninguém ensina==
    subtitulo: RoB 2, a ferramenta da Cochrane para avaliar o risco de viés de um ensaio clínico, com a IA como assistente.

  - tipo: texto
    tag: Por que importa
    titulo: Um ECR não é confiável ==só por ser randomizado==
    texto: |
      Randomização mal feita, perdas de seguimento e um desfecho escolhido depois de ver os dados podem distorcer qualquer resultado.

      O **RoB 2** organiza essa avaliação em 5 domínios.

  - tipo: lista
    tag: O método
    titulo: Os 5 domínios do RoB 2
    itens:
      - t: Processo de randomização
        d: A sequência era aleatória e oculta? Os grupos começaram parecidos?
      - t: Desvios das intervenções pretendidas
        d: Quebra de cegamento ou troca de tratamento afetaram o resultado?
      - t: Dados de desfecho faltantes
        d: Quantos participantes se perderam, e por quê?
      - t: Mensuração do desfecho
        d: Quem avaliou sabia o grupo? O método foi igual nos dois braços?
      - t: Seleção do resultado relatado
        d: O resultado segue o protocolo registrado antes?

  - tipo: texto
    tag: O julgamento
    titulo: Cada domínio recebe ==baixo risco, algumas preocupações ou alto risco==
    texto: |
      A avaliação é feita **por desfecho**, não pelo artigo inteiro.

      E o risco geral nunca é melhor que o do pior domínio.

  - tipo: prompt
    tag: Copie e cole
    titulo: O prompt
    prompt: |
      Atue como revisor metodológico treinado no RoB 2 (Cochrane).
      Anexei o ECR [ESTUDO] e, se houver, o protocolo ou registro.
      Desfecho a avaliar: [DESFECHO]

      Para cada um dos 5 domínios do RoB 2:
      1. Responda às perguntas sinalizadoras com: sim, provavelmente sim, provavelmente não, não ou sem informação.
      2. Cite o trecho do artigo que justifica cada resposta.
      3. Proponha um julgamento: baixo risco, algumas preocupações ou alto risco.

      Ao final, proponha o risco geral e liste o que devo conferir pessoalmente.
      Se o texto não trouxer a informação, responda "sem informação". Não suponha.

  - tipo: texto
    tag: O limite
    titulo: A IA ==sugere==. Você ==julga==.
    texto: |
      Ela pode deixar passar um detalhe do protocolo ou interpretar mal o cegamento.

      Use a resposta como rascunho e confira com a ferramenta oficial em **riskofbias.info**. Na revisão sistemática, a avaliação continua sendo de **dois revisores independentes**.

  - tipo: cta
    destaque: salvar
    titulo: Salve para o próximo ==ensaio clínico== que você ler.
    texto: No próximo post, as 5 regras para usar IA na pesquisa sem colocar você e o paciente em risco.
    extra: A biblioteca paper.ai__ está chegando. **Lista de espera no link da bio.**

legenda: |
  Leitura crítica de ensaio clínico com IA: como usar o RoB 2 (Cochrane) para avaliar risco de viés.

  Os 5 domínios do RoB 2:
  1. Processo de randomização
  2. Desvios das intervenções pretendidas
  3. Dados de desfecho faltantes
  4. Mensuração do desfecho
  5. Seleção do resultado relatado

  Cada domínio recebe baixo risco, algumas preocupações ou alto risco, e a avaliação é feita por desfecho.

  📋 PROMPT PARA COPIAR:

  Atue como revisor metodológico treinado no RoB 2 (Cochrane).
  Anexei o ECR [ESTUDO] e, se houver, o protocolo ou registro.
  Desfecho a avaliar: [DESFECHO]

  Para cada um dos 5 domínios do RoB 2:
  1. Responda às perguntas sinalizadoras com: sim, provavelmente sim, provavelmente não, não ou sem informação.
  2. Cite o trecho do artigo que justifica cada resposta.
  3. Proponha um julgamento: baixo risco, algumas preocupações ou alto risco.

  Ao final, proponha o risco geral e liste o que devo conferir pessoalmente.
  Se o texto não trouxer a informação, responda "sem informação". Não suponha.

  ⚠️ A IA sugere; você julga. Confira com a ferramenta oficial em riskofbias.info.

  Referência: Sterne JAC et al. RoB 2: a revised tool for assessing risk of bias in randomised trials. BMJ. 2019;366:l4898. doi:10.1136/bmj.l4898

  💾 Salve para o próximo ECR.

hashtags: [leituracritica, ensaioclinico, medicinabaseadaemevidencias, revisaosistematica, paperai]
