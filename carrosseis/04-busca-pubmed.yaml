titulo: A busca no PubMed
arquetipo: Prompt pronto
objetivo: salvamentos
publicar: Semana 2 · segunda

slides:
  - tipo: capa
    tag: Prompt pronto
    titulo: O prompt que monta sua busca no ==PubMed==
    subtitulo: Com termos MeSH, sinônimos e operadores booleanos, sem decorar sintaxe.
    comando: Minha pergunta PICO é [PERGUNTA]...

  - tipo: texto
    tag: O problema
    titulo: Buscar com palavras soltas ==deixa artigos importantes de fora==
    texto: |
      O mesmo conceito aparece com nomes diferentes: *SGLT2 inhibitors*, *gliflozins*, *empagliflozin*...

      A busca boa combina **termos MeSH** (o vocabulário oficial do PubMed) com **sinônimos no título e no resumo**.

  - tipo: lista
    tag: O método
    titulo: Anatomia de uma estratégia de busca
    itens:
      - t: Um bloco por conceito do PICO
        d: Em geral, P e I. O desfecho costuma ficar de fora para não perder artigos.
      - t: OR dentro de cada bloco
        d: Junta sinônimos. Termo MeSH OR palavras no título e resumo.
      - t: AND entre os blocos
        d: Exige que todos os conceitos apareçam.
      - t: Filtros só no fim
        d: Tipo de estudo, idioma e período, com moderação.

  - tipo: prompt
    tag: Copie e cole
    titulo: O prompt
    prompt: |
      Atue como bibliotecário especialista em buscas no PubMed.

      Minha pergunta PICO: [PERGUNTA PICO]

      1. Identifique os conceitos principais (P e I; inclua C e O só se forem essenciais).
      2. Para cada conceito, sugira o termo MeSH e de 5 a 10 sinônimos em inglês para buscar em [tiab].
      3. Monte a estratégia na sintaxe do PubMed: OR dentro de cada bloco e AND entre os blocos.
      4. Sugira filtros opcionais para [TIPO DE ESTUDO].

      Não invente termos MeSH. Se não tiver certeza, marque com "(verificar)".
    rodape: Troque o que está entre [colchetes]. Cole o resultado direto na caixa de busca do PubMed.

  - tipo: prompt
    tag: Exemplo de resultado
    titulo: SGLT2 na IC com fração de ejeção preservada
    rotulo: BUSCA
    copiavel: false
    prompt: |
      ("Sodium-Glucose Transporter 2 Inhibitors"[Mesh]
        OR "SGLT2 inhibitor*"[tiab]
        OR gliflozin*[tiab]
        OR empagliflozin[tiab]
        OR dapagliflozin[tiab])
      AND
      ("Heart Failure"[Mesh]
        OR "heart failure"[tiab])
      AND
      ("preserved ejection fraction"[tiab]
        OR HFpEF[tiab])
    rodape: "[Mesh] busca pelo vocabulário controlado; [tiab], no título e no resumo; o * busca variações da palavra."

  - tipo: lista
    tag: Antes de rodar
    titulo: Confira em 3 passos
    estilo: check
    itens:
      - t: Valide cada termo MeSH
        d: Pesquise no MeSH Database do PubMed. A IA pode errar o nome do descritor.
      - t: Teste com artigos que você já conhece
        d: Se os estudos-chave não aparecem, a busca está estreita demais.
      - t: Registre a estratégia
        d: Base, data e a busca exata. Revisão sistemática exige isso (PRISMA 2020).

  - tipo: cta
    destaque: salvar
    titulo: Salve para a sua ==próxima busca==.
    texto: No próximo post, o erro que pode fazer você citar um artigo que não existe.
    extra: A biblioteca paper.ai__ está chegando. **Lista de espera no link da bio.**

legenda: |
  Como fazer busca no PubMed com IA: o prompt que monta a estratégia com MeSH e operadores booleanos.

  Buscar com palavras soltas deixa artigos importantes de fora. A estratégia boa tem um bloco por conceito, sinônimos ligados por OR e blocos ligados por AND.

  📋 PROMPT PARA COPIAR:

  Atue como bibliotecário especialista em buscas no PubMed.

  Minha pergunta PICO: [PERGUNTA PICO]

  1. Identifique os conceitos principais (P e I; inclua C e O só se forem essenciais).
  2. Para cada conceito, sugira o termo MeSH e de 5 a 10 sinônimos em inglês para buscar em [tiab].
  3. Monte a estratégia na sintaxe do PubMed: OR dentro de cada bloco e AND entre os blocos.
  4. Sugira filtros opcionais para [TIPO DE ESTUDO].

  Não invente termos MeSH. Se não tiver certeza, marque com "(verificar)".

  ⚠️ Confira todo termo no MeSH Database antes de rodar a busca e teste com artigos que você já conhece.

  💾 Salve para a próxima busca e siga @paper.ai__.

hashtags: [pubmed, pesquisamedica, revisaosistematica, promptsdeia, paperai]
