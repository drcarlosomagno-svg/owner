  - tipo: texto
    selo: Japão, 1965
    titulo: Um pedômetro chamado ==manpo-kei.==
    texto: |
      Em japonês, "medidor de 10 mil passos". O nome pegou, atravessou o século e foi parar no seu relógio.

      Faltava alguém medir se o número fazia sentido.

  - tipo: texto
    selo: O estudo
    titulo: 15 estudos. ==47.471 adultos.==
    texto: |
      Uma equipe liderada pela Universidade de Massachusetts juntou os dados de gente que usou contador de passos e foi acompanhada por cerca de 7 anos.

      Nesse tempo, 3.013 pessoas morreram. A pergunta: quantos passos separavam um grupo do outro?

  - tipo: lista
    selo: Os quatro grupos
    titulo: Risco de morte, comparado a ==quem menos andou.==
    itens:
      - t: Cerca de 3.500 passos por dia
        d: o ponto de partida
      - t: Cerca de 5.800 passos
        d: 40% menos risco
      - t: Cerca de 7.800 passos
        d: 45% menos risco
      - t: Cerca de 10.900 passos
        d: 53% menos risco
    nota: Mediana de passos de cada grupo. Paluch et al. Lancet Public Health, 2022

  - tipo: frase
    frase: O maior salto ==foi o primeiro.==
    texto: |
      Sair de 3.500 para perto de 6 mil passos já apareceu com 40% menos risco. Os dois degraus seguintes, somados, acrescentaram bem menos.

  - tipo: texto
    selo: E depois?
    titulo: A curva ==achata.==
    texto: |
      Com 60 anos ou mais, o risco parou de cair entre 6 mil e 8 mil passos. Com menos de 60, entre 8 mil e 10 mil.

      Os próprios autores escrevem, logo no começo do artigo, que há pouca evidência a favor dos 10 mil.

  - tipo: estudo
    revista: Paluch et al. · The Lancet Public Health, 2022
    quem: 47.471 adultos de 15 estudos, acompanhados por uma mediana de 7,1 anos
    achou: Mais passos, menos morte, até um platô que muda com a idade
    limite: É associação. Quem anda mais pode ser quem já tinha mais saúde. E o platô é uma média de grupos, não uma meta individual testada em ensaio.
    doi: 10.1016/S2468-2667(21)00302-9

  - tipo: texto
    selo: O que fazer com isso
    titulo: Se você anda 3 mil, ==não comece pelos 10 mil.==
    texto: |
      No estudo, a maior diferença apareceu em quem estava no fundo da tabela e subiu um degrau.

      Mirar no próximo degrau é mais fiel aos dados do que mirar no número redondo. E pesa bem menos na consciência.

  - tipo: cta
    destaque: enviar
    titulo: Manda pra quem ==se culpa== por não bater 10 mil.
    texto: E salva pra quando o relógio vibrar cobrando.
    fonte: "Paluch AE et al. Lancet Public Health. 2022 · doi:10.1016/S2468-2667(21)00302-9"

legenda: |
  Quantos passos por dia? A meta de 10 mil era nome de um pedômetro japonês. Um estudo com 47 mil adultos mediu o que importa.

  Em 1965, um aparelho japonês foi vendido como manpo-kei, "medidor de 10 mil passos". O número virou regra sem nunca ter sido testado.

  Em 2022, uma metanálise de 15 estudos (47.471 adultos, cerca de 7 anos de acompanhamento) comparou quatro grupos. Em relação a quem andava cerca de 3.500 passos por dia, o risco de morte foi 40% menor com 5.800, 45% menor com 7.800 e 53% menor com 10.900. O maior salto foi o primeiro. E o benefício se estabilizou entre 6 e 8 mil passos para quem tem 60 anos ou mais, e entre 8 e 10 mil para quem tem menos.

  É um estudo de associação: não prova que os passos, sozinhos, explicam a diferença.

  A história do manpo-kei está contada na Revista Questão de Ciência.

  Fonte: Paluch AE et al. Daily steps and all-cause mortality: a meta-analysis of 15 international cohorts. Lancet Public Health. 2022;7(3):e219-28. doi:10.1016/S2468-2667(21)00302-9

