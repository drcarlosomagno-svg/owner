titulo: O jejum intermitente empatou com o básico
pauta: Jejum intermitente e "janela de alimentação" como estratégia para emagrecer
estudo: Liu et al. (N Engl J Med, 2022)
paleta: claro
objetivo: envios
publicar: Semana 3 · sexta
