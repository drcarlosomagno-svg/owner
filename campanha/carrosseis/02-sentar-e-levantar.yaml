  - tipo: texto
    selo: Rio de Janeiro
    titulo: Um teste sem aparelho nenhum.
    texto: |
      O médico Claudio Gil Araújo criou o teste na sua clínica de medicina do exercício, no Rio.

      Você começa com 10 pontos. Perde 1 a cada apoio de mão ou joelho, e meio ponto se desequilibrar. Sentar vale 5. Levantar vale 5.

  - tipo: texto
    selo: Setembro de 2026
    titulo: O estudo novo ==saiu este mês.==
    texto: |
      4.282 adultos de 46 a 75 anos fizeram o teste e foram acompanhados por cerca de 12 anos.

      Nesse tempo, 665 morreram. A pergunta era se a nota do chão tinha avisado antes.

  - tipo: numero
    selo: Quem tirou nota 10
    numero: "3,7%"
    titulo: morreram no período.
    texto: |
      Entre quem tirou de 0 a 4, foram **42,1%**.
    fonte: Araújo et al. Eur J Prev Cardiol, 2026

  - tipo: frase
    frase: 6 vezes mais risco de ==morte cardiovascular.==
    texto: |
      Comparando a nota mais alta com a mais baixa, e já descontando idade, sexo, peso e doenças, o risco de morte cardiovascular foi 6,05 vezes maior. O de morte natural, 3,84 vezes.

  - tipo: texto
    selo: Por que um gesto tão simples
    titulo: Levantar do chão ==cobra tudo de uma vez.==
    texto: |
      Força, potência, flexibilidade, equilíbrio e composição do corpo.

      Os autores chamam isso de aptidão não aeróbica. É a parte do condicionamento que a esteira não mede.

  - tipo: estudo
    revista: Araújo et al. · European Journal of Preventive Cardiology, 2026
    quem: 4.282 adultos de 46 a 75 anos (68% homens) da coorte da clínica CLINIMEX, no Rio
    achou: Nota baixa no teste associada a mais morte natural e cardiovascular em 12 anos
    limite: É associação. O estudo não testou se treinar para melhorar a nota reduz o risco. E os participantes vieram de uma clínica, não de uma amostra de toda a população.
    doi: 10.1093/eurjpc/zwaf325

  - tipo: texto
    selo: Antes de tentar em casa
    titulo: Faça com ==alguém do lado.==
    texto: |
      Chão firme, descalço, espaço livre em volta. Se você tem dor no joelho ou no quadril, ou já caiu antes, faça com o seu médico ou fisioterapeuta.

      A nota serve de ponto de partida para uma conversa sobre força e equilíbrio.

  - tipo: cta
    destaque: enviar
    titulo: Manda pro seu pai ==fazer o teste.==
    texto: E conta nos comentários a nota de vocês dois.
