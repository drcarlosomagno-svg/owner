  - tipo: estudo
    revista: Goh et al. · JAMA Network Open, 2024
    quem: 50 médicos (26 assistentes e 24 residentes) de medicina de família, clínica médica e emergência
    achou: Com IA, raciocínio igual ao de quem não usou. A IA sozinha fez 16 pontos a mais
    limite: Casos escritos, não pacientes reais. Um modelo de 2023, já superado. E a vantagem da IA sozinha veio de uma análise exploratória, que ainda precisa ser confirmada.
