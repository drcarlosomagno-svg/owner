  - tipo: texto
    selo: O estudo
    titulo: 390.124 pessoas. ==Até 27 anos de seguimento.==
    texto: |
      Três grandes coortes americanas, com adultos sem câncer nem outras doenças crônicas no começo. Quase 165 mil morreram no período.

      A análise tentou descontar o estilo de vida e o efeito de quem começa a vitamina porque já está doente.

  - tipo: frase
    frase: Quem tomava ==não viveu mais.==
    texto: |
      Na primeira metade do acompanhamento, o risco de morte foi 4% maior entre os usuários. Na segunda, igual. O resultado se repetiu nas principais causas de morte.

  - tipo: texto
    selo: E tem um detalhe
    titulo: Quem toma vitamina ==já se cuidava mais.==
    texto: |
      Entre os usuários diários, havia menos fumantes e mais gente com faculdade.

      Mesmo com esse perfil a favor, o benefício não apareceu.

